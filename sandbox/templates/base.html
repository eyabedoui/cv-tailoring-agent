<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CV Agent Sandbox{% endblock %}</title>
<style>
body{font-family:system-ui,sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem}
h1{font-size:1.5rem}h2{font-size:1.1rem;margin-top:1.5rem}
ul{padding-left:1.2rem}li{margin:.2rem 0}
pre{background:#f4f4f4;padding:1rem;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.error{color:#c00}.note{color:#555;font-style:italic}
button{padding:.5rem 1.2rem;font-size:1rem;cursor:pointer}
a{color:#005a9c}
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
